<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandyOS Owner V1</title>
<style>:root{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#213648;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.header-tools{display:flex;gap:7px;flex-wrap:wrap}.header-tools button{font-size:12px;padding:8px 10px;background:#2e536d;color:white;border-color:#456d89}header{background:#17364d;color:white;padding:16px max(16px,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;align-items:center}main{max-width:1160px;margin:auto;padding:26px 18px 60px}h1{font-size:28px;margin:0}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:0 0 12px}.muted{font-size:13px;color:#6c8091}.notice{background:#fff8e8;border:1px solid #ecddbd;border-radius:10px;padding:12px;font-size:12px;color:#765e35}.nav,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav{margin:20px 0}.row{justify-content:space-between}.card{background:white;border:1px solid #e0e8f0;border-radius:14px;padding:20px;margin:15px 0}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.metric{background:#f1f6fa;padding:14px;border-radius:10px;color:#667d90;font-size:12px}.metric b{font-size:21px;display:block;color:#18354b;margin-top:6px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:12px 0}.fields>*{min-width:0}label{display:block;font-size:12px;font-weight:650;margin:0 0 5px;color:#566e80}input,select,button{font:inherit;border:1px solid #cfdce6;border-radius:9px;padding:10px}input,select{width:100%;background:white}button{font-weight:650;background:#e9f2fa;cursor:pointer;color:#173b55}button.primary,.nav .active{background:#176fbe;color:white;border-color:#176fbe}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #acd6f9;outline-offset:2px}.back{border:0;background:transparent;color:#1469b8;padding:0}.wrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px 9px;border-bottom:1px solid #e4ebf2;white-space:nowrap;font-size:13px}th{color:#677d90}tr[data-open]{cursor:pointer}tr[data-open]:hover{background:#f3f9ff}td button{padding:5px 10px}.pill{background:#edf4fa;padding:5px 10px;border-radius:50px;font-size:12px}.warn{color:#965d1e}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters .active{background:#176fbe;color:white}@media(max-width:700px){main{padding:18px 12px}.card{padding:14px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:14px 16px}th,td{padding:9px 7px}}@media print{header,.nav,.notice,button{display:none!important}.card{break-inside:avoid}}</style></head><body>
<header><strong>HandyOS / Owner V1</strong><div class="header-tools"><button id="exportCsv">Export CSV</button><button id="backup">Backup JSON</button><button id="restore">Restore backup</button></div></header><main><h1>Business Manager</h1><p class="muted">Jobs, employees, expenses, progress payments and estimated profit.</p><p class="notice"><b>Browser-only demo.</b> No secure login or cloud sync. Do not enter real employee, customer or payroll information. Personal employee links are deferred.</p>
<nav id="nav" class="nav"><button data-page="jobs">Jobs</button><button data-page="employees">Employees</button><button data-page="expenses">Expenses</button><button data-page="company">Overview</button></nav><section id="screen"></section></main>
<script type="module">
import {STORE_KEY,normalize,money,dollars,summary,canClose,snapshot,workerNames,workerTotals,workerByPeriod,employeesSummary,customerPayment,paymentBreakdown,wageYearSummary,periodSettlement,isSettlementCurrent,companySummary,expenseSummary} from "./owner-ledger-core.mjs";
import {parseOwnerBackup,ownerExports} from "./owner-ledger-io.mjs";
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")},uid=()=>crypto.randomUUID();
let state;try{state=normalize(JSON.parse(localStorage.getItem(STORE_KEY)||"{}"))}catch{state=normalize({})}
let page="jobs",jobId="",person="",period="week",year="",expenseKind="",expenseJob="",expenseMonth="",wageYear="";
const jNow=()=>state.jobs.find(j=>j.id===jobId),cash=dollars;
const field=(label,id,value="",type="text")=>'<div><label for="'+esc(id)+'">'+esc(label)+'</label><input type="'+type+'" id="'+esc(id)+'" value="'+esc(value)+'"></div>';
const opt=(key,value,selected)=>'<option value="'+esc(key)+'" '+(key===selected?"selected":"")+'>'+esc(value)+'</option>';
const metric=(label,value)=>'<div class="metric">'+esc(label)+'<b>'+esc(value)+'</b></div>';
const table=(heads,rows)=>'<div class="wrap"><table><thead><tr>'+heads.map(x=>'<th>'+esc(x)+'</th>').join("")+'</tr></thead><tbody>'+rows.join("")+'</tbody></table></div>';
function persist(){localStorage.setItem(STORE_KEY,JSON.stringify(state));render()}
function render(){for(const x of $("nav").querySelectorAll("[data-page]"))x.classList.toggle("active",x.dataset.page===page);$("screen").innerHTML=page==="jobs"?jobs():page==="employees"?employees():page==="expenses"?expenses():company()}
function expenseForm(){return '<div class="fields">'+field("Date","expenseDate",today(),"date")+field("Description","expenseTitle")+field("Amount AUD","expenseAmount","","number")+'<div><label>Category</label><select id="expenseKind">'+["material","subcontractor","equipment","labour","other"].map(x=>opt(x,x,"material")).join("")+'</select></div><div><label>Tax basis</label><select id="expenseBasis"><option value="inc">Incl 10% GST</option><option value="ex">Ex GST</option><option value="no_gst">No GST</option></select></div><div><label>Payment</label><select id="expensePaid"><option value="unpaid">Unpaid</option><option value="paid">Paid</option></select></div></div><button id="addExpense">+ Add expense</button>'}
function hoursForm(){const people=workerNames(state.jobs,state.staff);return '<div class="fields"><div><label>Employee name</label><select id="workerName"><option value="">Select employee</option>'+people.map(name=>opt(name,name,"")).join("")+'</select></div>'+field("Work date","workDate",today(),"date")+field("Hours","workHours","","number")+field("Hourly cost AUD","workRate","","number")+'</div><button id="addHours">+ Add hours</button><p class="muted">Add staff from the Employees tab first. Select their name here; the stored rate can be adjusted for this job.</p>'}
function jobs(){
 const j=jNow();if(!j)return '<div class="row"><h2>Jobs</h2><button class="primary" id="newJob">+ New job</button></div><p class="muted">Select a job to see costs, workers, payments and estimated profit.</p>'+
 table(["Job","Stage","Contract inc GST","Received","Est. profit",""],state.jobs.map(j=>{const s=summary(j);return '<tr data-open="job" data-id="'+esc(j.id)+'"><td><b>'+esc(j.name)+'</b></td><td>'+esc(j.stage)+'</td><td>'+(s.hasContract?cash(s.agreedInc):"Not set")+'</td><td>'+cash(s.received)+'</td><td>'+(s.profit===null?"Not ready":cash(s.profit))+'</td><td><button data-open="job" data-id="'+esc(j.id)+'">Open</button></td></tr>'}));
 const s=summary(j),cashDetail=paymentBreakdown(j),closed=j.stage==="closed";
 return '<button class="back" data-back="jobs">← All jobs</button><div class="row"><h2>'+esc(j.name)+'</h2><span class="pill">'+esc(j.stage)+'</span></div>'+
 '<div class="metrics">'+metric("Adjusted contract inc GST",s.totalContractInc===null?"Not ready":cash(s.totalContractInc))+metric("Client payments received",cash(s.received))+metric("Recorded cost ex GST",cash(s.costEx))+metric("Final estimated profit",s.profit===null?"Not ready":cash(s.profit))+'</div>'+
 '<div class="card"><h3>Contract and status</h3><div class="fields">'+field("Contract amount inc GST","contract",s.hasContract?s.agreedInc:"","number")+field("Tax & Reserve Fund (%)","taxReservePct",j.taxReservePct??"","number")+field("Remaining Costs ex GST (estimated)","remainingCostEx",j.remainingCostEx??"","number")+'<div><label>Stage</label><select id="stage">'+["survey","scope","estimate","quoted","approved","scheduled","active","handover"].map(x=>opt(x,x,j.stage)).join("")+'</select></div></div><p class="muted">Single combined tax & contingency reserve, entered by Owner. Calculated as a percentage of the TOTAL agreed contract including GST. It is not a paid expense or a calculated tax liability. Leave blank for 0%. Remaining Costs is your estimate of work still to pay for, ex GST. It is not an expense already incurred; reduce it as you record real costs to prevent double counting.</p>'+(closed?'<p class="muted">Closed; reopen to edit.</p><button id="reopenJob">Reopen job</button>':'<button id="saveJob">Save contract</button> <button id="closeJob">Finish / close job</button>')+(j.closeSnapshot?'<p class="muted">Previous close snapshot '+esc(j.closeSnapshot.closedAt)+' · Profit estimate '+cash(j.closeSnapshot.profitEstimate)+'</p>':'')+'</div>'+
 '<div class="card"><details><summary>Optional: approved contract variations & overhead</summary><div class="fields">'+field("Approved variations incl GST (+ / −)","approvedVariationInc",j.approvedVariationInc??"","number")+field("Unbooked overhead allocation ex GST","overheadAllocationEx",j.overheadAllocationEx??"","number")+'</div><p class="muted">Enter only approved contract variations (positive or negative); pending variations are excluded. Overhead is an extra planning allocation only if it is NOT already recorded in Expenses, labour or Remaining Costs. These amounts are not automatically added to expense or payment ledgers.</p></details></div>'+
 '<div class="card"><h3>Job profit summary</h3>'+table(["Component","AUD"],[
'<tr><td>Contract value inc GST</td><td>'+(s.hasContract?cash(s.agreedInc):"Not set")+'</td></tr>',
'<tr><td>Approved contract variations inc GST</td><td>'+(s.approvedVariationInc===null?"Invalid":cash(s.approvedVariationInc))+'</td></tr>',
'<tr><td>Adjusted contract value inc GST</td><td>'+(s.totalContractInc===null?"Invalid":cash(s.totalContractInc))+'</td></tr>',
'<tr><td>Adjusted contract value ex GST</td><td>'+(s.totalContractEx===null?"Invalid":cash(s.totalContractEx))+'</td></tr>',
'<tr><td>Other expenses (ex GST, already included below)</td><td>'+cash(s.otherExpensesEx)+'</td></tr>',
'<tr><td>All recorded expenses ex GST (including other)</td><td>'+cash(s.expensesEx)+'</td></tr>',
'<tr><td>Labour accrued</td><td>'+cash(s.labour)+'</td></tr>',
'<tr><td>Remaining costs to complete (estimated ex GST)</td><td>'+(s.remainingCostEx===null?"Invalid":cash(s.remainingCostEx))+'</td></tr>',
'<tr><td>Overhead allocation (unbooked ex GST)</td><td>'+(s.overheadAllocationEx===null?"Invalid":cash(s.overheadAllocationEx))+'</td></tr>',
'<tr><td>Forecast profit before reserve</td><td>'+(s.profitBeforeReserve===null?"Not ready":cash(s.profitBeforeReserve))+'</td></tr>',
'<tr><td>Tax & Reserve Fund ('+(s.taxReservePct===null?"Invalid":s.taxReservePct)+'% of contract incl GST)</td><td>'+(s.taxReserveAmount===null?"Not ready":cash(s.taxReserveAmount))+'</td></tr>',
'<tr><td><b>Final estimated profit after reserve</b></td><td><b>'+(s.profit===null?"Not ready":cash(s.profit))+'</b></td></tr>'])+'<p class="muted">Other expenses are already included in recorded expenses. Only approved variations affect contract revenue. Reduce Remaining Costs as you enter actual invoices and labour. Remaining Costs and overhead are owner-entered allocations, each deducted once and must not duplicate recorded expenses. Reserve is deducted once on adjusted contract incl GST. Forecast profit is not actual accounting profit or a tax assessment.</p></div>'+
 '<div class="card"><div class="row"><h3>Progress payments</h3><span class="pill">Cash '+cash(s.received)+' · Net after GST '+cash(s.paymentReceivedNet)+'</span></div><p class="muted">Payment amount is recorded as actual customer cash. Incl GST: entered amount already includes GST. Ex GST: add 10% to calculate cash. No GST: entered amount equals cash received.</p>'+(closed?"":'<div class="fields">'+field("Reference","payRef")+field("Amount entered AUD","payAmount","","number")+'<div><label>GST treatment</label><select id="payBasis"><option value="inc">Incl GST</option><option value="ex">Ex GST (+10%)</option><option value="no_gst">No GST</option></select></div><div><label>Status</label><select id="payStatus"><option value="requested">Requested</option><option value="received">Received</option></select></div></div><button id="addPayment">+ Add payment</button>')+
 table(["Reference","Status","GST basis","Amount entered","Actual cash","Net after GST",""],cashDetail.entries.map(x=>'<tr><td>'+esc(x.reference)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.gstBasis||"inc (legacy)")+'</td><td>'+cash(x.enteredAmount??x.amount)+'</td><td>'+cash(x.amount)+'</td><td>'+(Number.isFinite(x.net)?cash(x.net):"Unknown")+'</td><td>'+(closed?"":'<button data-delete="payments" data-id="'+esc(x.id)+'">Delete</button>')+'</td></tr>'))+'</div>'+
 '<div class="card"><h3>Job expenses</h3>'+(closed?"":expenseForm())+table(["Date","Description","Category","Amount","GST basis",""],j.expenses.map(x=>'<tr><td>'+esc(x.date||"—")+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.kind)+'</td><td>'+cash(x.amount)+'</td><td>'+esc(x.gstBasis||"unknown")+'</td><td>'+(closed?"":'<button data-delete="expenses" data-id="'+esc(x.id)+'">Delete</button>')+'</td></tr>'))+'</div>'+
 '<div class="card"><h3>Labour hours</h3>'+(closed?"":hoursForm())+table(["Employee","Date","Hours","Rate","Wages earned",""],j.timesheets.map(x=>'<tr><td>'+esc(x.worker)+'</td><td>'+esc(x.date)+'</td><td>'+esc(x.hours)+'</td><td>'+cash(x.rate)+'</td><td>'+cash(Number(x.hours)*Number(x.rate))+'</td><td>'+(closed?"":'<button data-delete="timesheets" data-id="'+esc(x.id)+'">Delete</button>')+'</td></tr>'))+'</div>'+
 (s.risks.length?'<div class="card"><h3>Checks</h3>'+s.risks.map(x=>'<p class="warn">• '+esc(x)+'</p>').join("")+'</div>':"");
}
function employees(){
 if(!person){const all=employeesSummary(state.jobs,state.staff),annual=wageYearSummary(state.jobs,wageYear,state.staff);
const years=[...new Set(state.jobs.flatMap(j=>[...j.timesheets.map(t=>String(t.date||"").slice(0,4)),...(j.workerPayments||[]).map(p=>String(p.paidOn||"").slice(0,4))]).filter(y=>/^\d{4}$/.test(y)))].sort().reverse();
return '<div class="row"><h2>Employees</h2><button id="toggleStaffForm" class="primary">+ Add staff</button></div><p class="muted">Employee list first. Select a person to view their wage ledger.</p><div class="card" id="staffForm" hidden><h3>New employee</h3><div class="fields">'+field("Name","staffName")+field("Role / trade","staffRole")+field("Default hourly cost AUD","staffRate","","number")+'</div><button id="addStaff">Save employee</button><p class="muted">Local demonstration only. Avoid real employee details until secure storage is active.</p></div><div class="fields"><div><label>Year</label><select id="wageYearFilter">'+opt("","All years",wageYear)+years.map(y=>opt(y,y,wageYear)).join("")+'</select></div></div>'+
 '<p class="muted">Yearly difference is earnings recorded in that year minus payments made in that year; it is not necessarily the outstanding balance for that year.</p><div class="metrics">'+metric("Workers",all.length)+metric("Wages earned",cash(annual.earned))+metric("Wages paid",cash(annual.paid))+metric("Earned less payments",cash(annual.earned-annual.paid))+'</div>'+
 table(["Employee","Hours","Earned","Paid","Earned − paid",""],annual.rows.map(x=>'<tr data-open="worker" data-name="'+esc(x.name)+'"><td><b>'+esc(x.name)+'</b></td><td>'+x.hours+'</td><td>'+cash(x.earned)+'</td><td>'+cash(x.paid)+'</td><td>'+cash(x.difference)+'</td><td><button data-open="worker" data-name="'+esc(x.name)+'">Details</button></td></tr>'))}
 const member=state.staff.find(x=>x.name.trim().toLowerCase()===person.trim().toLowerCase()),w=workerTotals(state.jobs,person),rows=workerByPeriod(state.jobs,person,period),settlements=state.payrollSettlements.filter(x=>x.worker.trim().toLowerCase()===person.trim().toLowerCase());
 return '<button class="back" data-back="employees">← All employees</button><h2>'+esc(person)+'</h2><div class="metrics">'+metric("Hours",w.hours)+metric("Earned",cash(w.due))+metric("Paid",cash(w.paid))+metric("Outstanding",cash(w.outstanding))+'</div>'+
 '<div class="card"><h3>Staff information</h3><div class="fields">'+field("Name","staffDetailName",member?.name||person)+field("Role / trade","staffDetailRole",member?.role||"")+field("Default hourly cost AUD","staffDetailRate",member?.rate??"","number")+'</div><button id="saveStaff">Save staff details</button><p class="muted">Changing a name already used in job timesheets is not supported. Name edits need a controlled migration.</p></div><div class="card"><h3>Weekly / monthly / yearly wages</h3><div class="filters">'+["week","month","year"].map(x=>'<button data-period="'+x+'" class="'+(period===x?"active":"")+'">'+esc(x)+'</button>').join("")+'</div>'+
 table(["Period","Hours","Earned","Paid","Balance",""],rows.map(x=>'<tr><td>'+esc(x.period)+'</td><td>'+x.hours+'</td><td>'+cash(x.earned)+'</td><td>'+cash(x.paid)+'</td><td>'+cash(x.outstanding)+'</td><td>'+(period==="year"?"—":'<button data-settle="'+esc(x.period)+'">Close period</button>')+'</td></tr>'))+
 '<p class="muted">Payments grouped by payment date, not allocated automatically to specific workdays. Closing a period records a snapshot only, not a payment.</p></div><div class="card"><h3>Saved payroll settlements</h3>'+table(["Period","Type","Earned","Paid","Balance","Review"],settlements.map(x=>'<tr><td>'+esc(x.key)+'</td><td>'+esc(x.period)+'</td><td>'+cash(x.earned)+'</td><td>'+cash(x.paid)+'</td><td>'+cash(x.balance)+'</td><td>'+(isSettlementCurrent(state.jobs,x)?"Up to date":"Changed since close")+'</td></tr>'))+'</div>'+
 '<div class="card"><h3>By job</h3>'+table(["Job","Earned","Paid","Outstanding"],state.jobs.filter(j=>j.timesheets.some(x=>x.worker?.trim().toLowerCase()===person.toLowerCase())||j.workerPayments?.some(x=>x.worker?.trim().toLowerCase()===person.toLowerCase())).map(j=>{const x=workerTotals(state.jobs,person,j.id);return '<tr><td>'+esc(j.name)+'</td><td>'+cash(x.due)+'</td><td>'+cash(x.paid)+'</td><td>'+cash(x.outstanding)+'</td></tr>'}))+'</div>'+
 '<div class="card"><h3>Record wages paid</h3><p class="muted">Payments are cash movements, not another wage expense.</p><div class="fields"><div><label>Job</label><select id="wageJob">'+state.jobs.map(j=>opt(j.id,j.name,state.jobs[0]?.id)).join("")+'</select></div>'+field("Payment date","wageDate",today(),"date")+field("Amount paid","wageAmount","","number")+'</div><button id="addWage">+ Record wages paid</button>'+
 table(["Job","Date","Paid",""],w.payments.map(x=>'<tr><td>'+esc(x.jobName)+'</td><td>'+esc(x.paidOn)+'</td><td>'+cash(x.amount)+'</td><td><button data-remove-wage="'+esc(x.id)+'" data-job="'+esc(x.jobId)+'">Delete</button></td></tr>'))+'</div>';
}
function expenses(){const x=expenseSummary(state.jobs,{year,month:expenseMonth,kind:expenseKind,jobId:expenseJob});const allDates=state.jobs.flatMap(j=>j.expenses.map(e=>String(e.date||""))),years=[...new Set(allDates.map(d=>d.slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort().reverse(),months=[...new Set(allDates.map(d=>d.slice(0,7)).filter(m=>/^\d{4}-\d{2}$/.test(m)&&(!year||m.startsWith(year))))].sort().reverse();
 return '<div class="row"><h2>All expenses</h2></div><div class="fields"><div><label>Year</label><select id="yearFilter">'+opt("","All years",year)+years.map(y=>opt(y,y,year)).join("")+'</select></div><div><label>Month</label><select id="monthFilter">'+opt("","All months",expenseMonth)+months.map(m=>opt(m,m,expenseMonth)).join("")+'</select></div><div><label>Category</label><select id="kindFilter">'+opt("","All categories",expenseKind)+["material","labour","subcontractor","equipment","other"].map(k=>opt(k,k,expenseKind)).join("")+'</select></div><div><label>Job</label><select id="jobFilter">'+opt("","All jobs",expenseJob)+state.jobs.map(j=>opt(j.id,j.name,expenseJob)).join("")+'</select></div></div><div class="metrics">'+metric("Entered total",cash(x.entered))+metric("Ex GST total",cash(x.net))+metric("Marked paid",cash(x.paid))+metric("GST unknown",x.unclassified)+'</div>'+
 table(["Date","Job","Type","Description","Entered","Ex GST","Paid?"],x.entries.map(e=>'<tr><td>'+esc(e.date||"—")+'</td><td>'+esc(e.jobName)+'</td><td>'+esc(e.kind)+'</td><td>'+esc(e.title)+'</td><td>'+cash(e.amount)+'</td><td>'+(Number.isFinite(e.net)?cash(e.net):"Unknown")+'</td><td>'+esc(e.paidStatus||"Unknown")+'</td></tr>'))}
function company(){const x=companySummary(state.jobs);return '<h2>Company overview</h2><div class="metrics">'+metric("All jobs",x.jobs)+metric("Open jobs",x.open)+metric("Customer cash received",cash(x.received))+metric("Expenses ex GST",cash(x.expensesEx))+metric("Wages earned",cash(x.labourDue))+metric("Wages paid",cash(x.wagesPaid))+metric("Wages outstanding",cash(x.wagesOutstanding))+metric("Other expenses paid",cash(x.expensesPaid))+'</div>'+
 '<div class="card"><h3>Profit by job</h3>'+table(["Job","Adjusted contract inc GST","Recorded cost ex GST","Remaining Costs ex GST","Overhead ex GST","Tax & Reserve Fund","Final estimated profit"],state.jobs.map(j=>{const s=summary(j);return '<tr><td>'+esc(j.name)+'</td><td>'+(s.totalContractInc===null?"Not ready":cash(s.totalContractInc))+'</td><td>'+cash(s.costEx)+'</td><td>'+(s.remainingCostEx===null?"Invalid":cash(s.remainingCostEx))+'</td><td>'+(s.overheadAllocationEx===null?"Invalid":cash(s.overheadAllocationEx))+'</td><td>'+(s.taxReserveAmount===null?"Not ready":cash(s.taxReserveAmount))+'</td><td>'+(s.profit===null?"Not ready":cash(s.profit))+'</td></tr>'}))+
 '<p class="muted">Final estimated profit = adjusted contract ex GST (base contract plus approved variations) − recorded expenses ex GST − earned wages − Remaining Costs ex GST − unbooked overhead ex GST − one combined Tax & Reserve Fund (% of adjusted contract incl GST). Other expenses are included in recorded expenses. Paying wages does not reduce profit twice. Reserve is an Owner planning allocation, not a tax assessment or BAS calculation.</p></div>'}
const positive=id=>{const n=money($(id)?.value);return Number.isFinite(n)&&n>0?n:null};
$("nav").onclick=event=>{const b=event.target.closest("[data-page]");if(!b)return;page=b.dataset.page;jobId="";person="";render()};
$("screen").onchange=event=>{const id=event.target.id,value=event.target.value;if(id==="workerName"){const member=state.staff.find(x=>x.name.trim().toLowerCase()===String(value).trim().toLowerCase());if(member&&Number.isFinite(Number(member.rate)))$("workRate").value=member.rate;return}if(id==="yearFilter"){year=value;expenseMonth="";render()}else if(id==="monthFilter"){expenseMonth=value;render()}else if(id==="kindFilter"){expenseKind=value;render()}else if(id==="jobFilter"){expenseJob=value;render()}else if(id==="wageYearFilter"){wageYear=value;render()}};
$("screen").onclick=event=>{
 const b=event.target.closest("button,[data-open]");if(!b)return;
 if(b.dataset.open==="job"){jobId=b.dataset.id;render();return}
 if(b.dataset.open==="worker"){person=b.dataset.name;period="week";render();return}
 if(b.dataset.back==="jobs"){jobId="";render();return}
 if(b.dataset.back==="employees"){person="";render();return}
 if(b.dataset.period){period=b.dataset.period;render();return}
 if(b.dataset.settle){try{const receipt=periodSettlement(state.jobs,person,period,b.dataset.settle);if(!confirm("Save "+person+" / "+b.dataset.settle+" wage settlement snapshot? This does NOT pay wages or lock timesheets."))return;state.payrollSettlements=state.payrollSettlements.filter(x=>!(x.worker.toLowerCase()===person.toLowerCase()&&x.period===period&&x.key===b.dataset.settle));state.payrollSettlements.push({...receipt,id:uid(),savedOn:today()});persist();}catch(err){alert(err.message)}return}
 if(b.id==="toggleStaffForm"){const form=$("staffForm");form.hidden=!form.hidden;return}
 if(b.id==="addStaff"){const name=$("staffName")?.value.trim().slice(0,120),role=$("staffRole")?.value.trim().slice(0,100),rate=money($("staffRate")?.value);if(!name||!Number.isFinite(rate))return alert("Enter a staff name and valid non-negative hourly cost.");if(workerNames(state.jobs,state.staff).some(n=>n.toLowerCase()===name.toLowerCase()))return alert("Employee already exists. Open their detail instead.");state.staff.push({id:uid(),name,role,rate,active:true});persist();return}
 if(b.id==="saveStaff"){const member=state.staff.find(x=>x.name.trim().toLowerCase()===person.trim().toLowerCase());if(!member)return alert("This employee came from historical timesheets. Add a staff record for them first.");const name=$("staffDetailName").value.trim(),rate=money($("staffDetailRate").value),role=$("staffDetailRole").value.trim();if(name!==member.name)return alert("To protect timesheet links, staff name cannot be changed here.");if(!Number.isFinite(rate))return alert("Enter a valid hourly cost.");member.rate=rate;member.role=role;persist();return}
 if(b.id==="newJob"){const name=prompt("New job name");if(!name?.trim())return;const j={id:uid(),name:name.trim().slice(0,120),code:"",stage:"survey",contract:0,taxReservePct:0,remainingCostEx:0,approvedVariationInc:0,overheadAllocationEx:0,expenses:[],payments:[],timesheets:[],workerPayments:[],tasks:[],categories:[],materials:[]};state.jobs.push(j);jobId=j.id;persist();return}
 const j=jNow();
 if(b.id==="saveJob"&&j){const n=money($("contract").value),raw=$("taxReservePct").value,rate=raw===""?0:Number(raw),remainingRaw=$("remainingCostEx").value,remaining=remainingRaw===""?0:money(remainingRaw),variationRaw=$("approvedVariationInc").value,variation=variationRaw===""?0:Number(variationRaw),overheadRaw=$("overheadAllocationEx").value,overhead=overheadRaw===""?0:money(overheadRaw);if(!Number.isFinite(n))return alert("Enter valid contract amount.");if(!Number.isFinite(rate)||rate<0||rate>100)return alert("Tax & Reserve Fund must be from 0% to 100%.");if(!Number.isFinite(remaining))return alert("Remaining Costs must be a valid non-negative amount ex GST.");if(!Number.isFinite(variation)||n+variation<=0)return alert("Approved variations must leave total contract greater than zero.");if(!Number.isFinite(overhead))return alert("Overhead must be a valid non-negative amount ex GST.");j.contract=n;j.taxReservePct=rate;j.remainingCostEx=remaining;j.approvedVariationInc=Math.round(variation*100)/100;j.overheadAllocationEx=overhead;j.stage=$("stage").value;persist();return}
 if(b.id==="closeJob"&&j){const gate=canClose(j);if(!gate.ok)return alert(gate.reason);if(!confirm("Close this job with an estimated profit snapshot?"))return;j.closeSnapshot=snapshot(j,today());j.stage="closed";persist();return}
 if(b.id==="reopenJob"&&j){if(!confirm("Reopen job? Previous closing snapshot remains."))return;j.stage="active";persist();return}
 if(b.id==="addPayment"&&j){const reference=$("payRef").value.trim();if(!reference)return alert("Enter a reference.");let values;try{values=customerPayment($("payAmount").value,$("payBasis").value)}catch(err){return alert(err.message)}j.payments.push({id:uid(),reference,...values,status:$("payStatus").value,date:today()});persist();return}
 if(b.id==="addExpense"&&j){const amount=positive("expenseAmount"),title=$("expenseTitle").value.trim();if(!amount||!title||!$("expenseDate").value)return alert("Enter expense date, description, amount.");j.expenses.push({id:uid(),date:$("expenseDate").value,title,amount,kind:$("expenseKind").value,gstBasis:$("expenseBasis").value,paidStatus:$("expensePaid").value});persist();return}
 if(b.id==="addHours"&&j){const worker=$("workerName").value.trim(),date=$("workDate").value,hours=Number($("workHours").value),rate=money($("workRate").value);if(!worker||!workerNames(state.jobs,state.staff).some(name=>name.toLowerCase()===worker.toLowerCase())||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(hours)||hours<=0||hours>24||!Number.isFinite(rate))return alert("Check worker, date, hours and rate.");j.timesheets.push({id:uid(),worker,date,hours,rate});persist();return}
 if(b.id==="addWage"){const target=state.jobs.find(j=>j.id===$("wageJob").value),amount=positive("wageAmount"),paidOn=$("wageDate").value;if(!target||!amount||!/^\d{4}-\d{2}-\d{2}$/.test(paidOn))return alert("Enter a job, date and amount.");target.workerPayments??=[];target.workerPayments.push({id:uid(),worker:person,paidOn,amount});persist();return}
 if(b.dataset.delete&&j){if(!confirm("Delete entry?"))return;j[b.dataset.delete]=j[b.dataset.delete].filter(x=>x.id!==b.dataset.id);persist();return}
 if(b.dataset.removeWage){if(!confirm("Delete wage payment?"))return;const target=state.jobs.find(j=>j.id===b.dataset.job);target.workerPayments=target.workerPayments.filter(x=>x.id!==b.dataset.removeWage);persist()}
};
function download(name,data,type){const blob=new Blob([data],{type}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$("backup").onclick=()=>download("HandyOS-Owner-"+today()+".json",JSON.stringify(state,null,2),"application/json");
$("exportCsv").onclick=()=>{const reports=ownerExports(state);for(const [label,data] of Object.entries(reports))download("HandyOS-"+label+"-"+today()+".csv",data,"text/csv;charset=utf-8")};
$("restore").onclick=()=>{
 const chooser=document.createElement("input");chooser.type="file";chooser.accept=".json,application/json";
 chooser.onchange=async()=>{try{const file=chooser.files?.[0];if(!file)return;if(file.size>10*1024*1024)throw new Error("Backup larger than 10 MB; restore cancelled.");
 const restored=parseOwnerBackup(await file.text());
 const jobs=restored.jobs.length,rows=restored.jobs.reduce((sum,j)=>sum+j.expenses.length+j.timesheets.length+j.payments.length+j.workerPayments.length,0);
 if(!confirm("Replace ALL data in this browser with "+jobs+" jobs and "+rows+" financial records from backup? Export your existing backup first. This cannot be undone."))return;
 localStorage.setItem(STORE_KEY,JSON.stringify(restored));state=restored;jobId="";person="";page="jobs";render();
 }catch(err){alert("Restore blocked: "+err.message)}};chooser.click()
};
render();
</script></body></html>
