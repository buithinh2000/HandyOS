<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HandyOS · Commercial UX Concept</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#162d3f;background:#f5f7fa;font-size:14px}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;min-height:44px}button:focus-visible{outline:3px solid #155f8a;outline-offset:2px}button:disabled{opacity:.6;cursor:not-allowed}.app{display:flex;min-height:100vh}.sidebar{width:224px;flex-shrink:0;background:#142d41;color:white;padding:25px 15px;display:flex;flex-direction:column;gap:24px}.brand{font-size:23px;font-weight:800;letter-spacing:-1px;padding:5px 13px}.sidebar nav{display:grid;gap:6px}.sidebar button{border:0;border-radius:9px;background:transparent;text-align:left;color:#c7d8e3;padding:12px 14px}.sidebar button[aria-current=page]{background:#ecf5fb;color:#16486b;font-weight:700}.side-footer{margin-top:auto;color:#9ab3c4;font-size:11px;padding:10px}.main{flex:1;min-width:0;padding:28px clamp(18px,3.2vw,46px) 85px;max-width:1420px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.eyebrow{font-size:12px;font-weight:700;color:#6d8291;text-transform:uppercase;letter-spacing:1px}.top h1{font-size:27px;letter-spacing:-.6px;margin:4px 0}.muted{color:#677d8c;font-size:12px;line-height:1.5}.chip{background:#e8eff5;border-radius:10px;padding:11px 13px;font-size:12px;font-weight:650}.pill{border-radius:100px;background:#edf3f7;color:#4d6779;padding:5px 9px;font-size:11px;font-weight:650}.card{background:white;border:1px solid #e0e8ef;border-radius:14px;padding:19px;margin:0 0 16px;box-shadow:0 3px 16px #18304006}.card h2{font-size:17px;letter-spacing:-.2px;margin:0 0 7px}.card h3{font-size:14px;margin:0 0 8px}.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}.button{border:1px solid #d8e3eb;background:white;color:#1b526f;padding:10px 14px;border-radius:9px;font-weight:700}.button.primary{background:#155f8a;color:white;border-color:#155f8a}.button.small{min-height:38px;padding:8px 10px;font-size:12px}.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.kpi{background:white;padding:17px;border:1px solid #e1e9ef;border-radius:12px}.kpi strong{display:block;font-size:22px;margin-top:12px;letter-spacing:-.5px}.kpi small{font-size:12px;color:#60778a}.staffgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:15px 0}.worker{display:flex;align-items:center;gap:9px;border:1px solid #dce6ed;border-radius:10px;padding:9px;font-weight:650;min-height:50px}.worker input{accent-color:#155f8a;width:19px;height:19px}.worker small{display:block;font-weight:400;color:#6f8493}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf2f6}.row:last-child{border:0}.row strong{display:block;font-size:13px}.row p{margin:3px 0 0}.rowlink{border:0;background:transparent;color:#155f8a;font-weight:700;padding:8px 0;min-height:38px}.status{display:inline-flex;padding:6px 9px;border-radius:7px;background:#eaf5ed;color:#216443;font-weight:700;font-size:11px}.status.warn{background:#fff3e3;color:#865b23}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-weight:700;font-size:12px;color:#425b6b}select,input{font:inherit;min-height:44px;border:1px solid #d4dfe7;padding:10px;border-radius:9px;background:white;width:100%}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.callout{background:#f0f6fb;padding:13px;border-radius:10px;color:#30546e;line-height:1.6}.sectionnav{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 20px}.sectionnav button{border:1px solid #d7e3ec;background:white;border-radius:8px;color:#415e74;padding:8px 14px;min-height:39px}.sectionnav button.selected{background:#e5f0f7;color:#155f8a;border-color:#aacadd}.right{margin-left:auto}.columns{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}.mockphoto{width:54px;height:62px;border:1px solid #b8c9d6;border-radius:7px;display:grid;place-items:center;background:linear-gradient(145deg,#f7f7f7,#e3e9ee);font-size:12px;color:#60778a;font-weight:700}.hidden{display:none!important}.mobile-nav{display:none}.banner{border:1px dashed #b9cddd;background:#eef4f9;color:#3c617a;border-radius:10px;padding:12px;margin-bottom:18px;font-size:12px}.bar{height:8px;border-radius:12px;background:#e2edf4;overflow:hidden}.bar span{display:block;height:100%;background:#3985ad}details summary{cursor:pointer;padding:9px 0;font-weight:700}
@media(max-width:1050px){.grid2,.columns{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.staffgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.sidebar{display:none}.main{padding:18px 14px 95px}.top h1{font-size:24px}.top{align-items:flex-start}.chip{padding:9px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e0e8ee;display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}.mobile-nav button{border:0;background:transparent;color:#688093;font-size:11px;padding:9px 0;min-height:53px}.mobile-nav button[aria-current=page]{font-weight:800;color:#155f8a}.fields{grid-template-columns:1fr}.staffgrid{grid-template-columns:repeat(2,1fr)}.card{padding:15px}.kpi strong{font-size:20px}}@media(max-width:370px){.staffgrid{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">HandyOS</div><nav id="sideNav"></nav><div class="side-footer">Product concept · No real data</div></aside><main class="main"><div class="banner">PRODUCT DESIGN PROTOTYPE · Synthetic sample records only · No database, authentication, wages processing or customer sending.</div><div class="top"><div><div class="eyebrow" id="eyebrow">Owner workspace</div><h1 id="title">Today</h1><div class="muted" id="subtitle">A clear view of your workday</div></div><div class="chip">Mon 16 Nov 2026</div></div><div id="view"></div></main></div><nav class="mobile-nav" id="mobileNav"></nav>
<script>
const screens=["Today","Jobs","People","Money","More"];let current="Today",detail="",crew=["Alex","Lee","Sam","Kim","Ben","Pat"],selected=new Set(crew),started=false,checkedOut=false;
const items={Today:"Today's operations, jobs and alerts",Jobs:"All jobs, one source of truth",People:"Individual staff, attendance and pay",Money:"Business finances and reconciliation",More:"Company and system settings"};
const sampleJobs=[["Bathroom renovation","In progress","Echuca","$8,800"],["Kitchen refit","Booked","Bendigo","$3,500"],["Deck replacement","Planning","Eaglehawk","$0"]];
function btn(text,action,cls="button"){return '<button type="button" class="'+cls+'" data-action="'+action+'">'+text+'</button>'}
function row(title,meta,status,action){return '<div class="row"><div><strong>'+title+'</strong><p class="muted">'+meta+'</p></div>'+(status?'<span class="status">'+status+'</span>':'')+(action?btn("View",action,"rowlink"):"")+'</div>'}
function kpi(label,value){return '<div class="kpi"><small>'+label+'</small><strong>'+value+'</strong></div>'}
function today(){return '<div class="grid2"><div><section class="card"><div class="cardhead"><div><h2>Daily crew · '+(checkedOut?"Completed":started?"Checked in":"Ready to start")+'</h2><div class="muted">Choose a job. Everyone active is selected by default.</div></div><span class="pill">'+selected.size+' of '+crew.length+'</span></div><div class="field"><label>Today’s job</label><select id="jobChoice"><option>Bathroom renovation · Echuca</option><option>Kitchen refit · Bendigo</option></select></div><div class="staffgrid">'+crew.map(name=>'<label class="worker"><input type="checkbox" value="'+name+'" data-crew '+(selected.has(name)?"checked":"")+' '+(started?"disabled":"")+'><span>'+name+'<small>Daily-rate crew</small></span></label>').join("")+'</div><div class="fields"><div class="field"><label>Start</label><input type="time" value="07:00" id="start" '+(started?"disabled":"")+'></div>'+(started&&!checkedOut?'<div class="field"><label>Finish</label><input type="time" value="15:30" id="finish"></div>':'<div class="field"><label>Unpaid break</label><select><option>30 minutes</option><option>None</option></select></div>')+'</div>'+(checkedOut?'<div class="callout">Shift recorded in concept mode. In the real system, review attendance before finalising wages.</div>':btn(started?"Check out & review":"Check in "+selected.size+" crew",started?"checkout":"checkin","button primary"))+'</section></div><div><section class="card"><div class="cardhead"><h2>Needs attention</h2><span class="pill">3 items</span></div>'+row("2 material bills not sent","Paint & fixings · Echuca","","viewBills")+row("Progress payment pending","Kitchen refit · $3,500","","payment")+row("Weekly pay review","6 active employees","","weekly")+'</section><section class="card"><div class="cardhead"><h2>Quick actions</h2></div>'+btn("Capture material receipt","capture","button primary")+' '+btn("Open Jobs","jobs")+'</section></div></div>'}
function jobs(){return '<section class="card"><div class="cardhead"><div><h2>Jobs</h2><div class="muted">A directory first. Every Job opens its full detail.</div></div>'+btn("+ New job","newjob","button primary")+'</div>'+sampleJobs.map(j=>row(j[0],j[2]+' · Customer cash '+j[3],j[1],"jobDetail")).join("")+'</section>'}
function people(){return detail==="staff"?'<div>'+btn("← All employees","backPeople")+'<section class="card"><h2>Alex · Carpenter</h2><div class="sectionnav">'+btn("Attendance","staff","button selected")+btn("Weekly Pay","weekly") +btn("History","history")+'</div><div class="callout">Each person owns their own calendar and wage ledger. Crew check-in writes into this same record, never a duplicate second timesheet.</div></section></div>':'<section class="card"><div class="cardhead"><div><h2>Employees</h2><div class="muted">Select a person to view attendance, wages and pay history.</div></div>'+btn("+ Add staff","addstaff","button primary")+'</div>'+crew.map((n,i)=>row(n,["Carpenter","Labourer","Apprentice"][i%3]+' · '+(i===5?"Away today":"Active"),"", "staff")).join("")+'</section>'}
function weekly(){return '<div>'+btn("← People","backPeople")+'<section class="card"><div class="cardhead"><div><h2>Alex · Weekly pay</h2><div class="muted">Week of 16–22 November</div></div><span class="pill">Needs review</span></div><div class="kpis">'+kpi("Paid days","4")+kpi("Base wages","$1,000")+kpi("Bonus","$100")+kpi("Other pay","$0")+'</div><div class="row"><strong>Total earned</strong><strong>$1,100</strong></div><div class="row"><strong>Already paid</strong><strong>$900</strong></div><div class="row"><strong>Outstanding</strong><strong>$200</strong></div><p class="muted">4 × $250 = $1,000; add $100 bonus once. Real payroll needs approval and audit.</p>'+btn("Review & close week","review","button primary")+'</section></div>'}
function money(){return '<div class="fields"><div class="field"><label>Report period</label><select id="period"><option>This week</option><option>This month</option><option>This year</option><option>All time</option></select></div></div><div class="kpis">'+kpi("Customer cash received","$8,800")+kpi("Wages paid","$4,150")+kpi("Expenses paid","$2,100")+kpi("Net cash movement","$2,550")+'</div><section class="card"><h2>Reconciliation & reports</h2><div class="muted">Cash flow is not profit; period selection is illustrative.</div>'+["Customer payments","Employee payroll","Job expenses","Tax actually paid","Estimated job profit"].map(n=>row(n,"Open the ledger and filter by Job or date","","report")).join("")+'</section>'}
function bill(){return '<div>'+btn("← Today","today")+'<section class="card"><div class="cardhead"><h2>Material bills · Bathroom renovation</h2>'+btn("+ Capture receipt","capture","button primary")+'</div><div class="kpis">'+kpi("Not sent","$110")+kpi("Sent","$220")+kpi("Reimbursed","$330")+kpi("Outstanding","$330")+'</div>'+row("Paint Store · $110","Photo stored privately in AWS in production","Not sent","capture")+row("Fixings · $220","Awaiting customer reimbursement","Sent","capture")+row("Timber · $330","Customer has reimbursed","Reimbursed","capture")+'</section></div>'}
function capture(){return '<div>'+btn("← Material bills","viewBills")+'<section class="card"><h2>Capture material receipt</h2><p class="muted">UI concept only. No image upload or customer message is performed.</p><div class="fields"><div class="field"><label>Job</label><select><option>Bathroom renovation</option><option>Kitchen refit</option></select></div><div class="field"><label>Store</label><input placeholder="Bunnings"></div><div class="field"><label>Amount AUD</label><input type="number" inputmode="decimal" placeholder="110.00"></div><div class="field"><label>Purchase date</label><input type="date" value="2026-11-16"></div><div class="field"><label>Receipt photo</label><input type="file" accept="image/*" capture="environment"></div><div class="field"><label>Customer status</label><select><option>Not sent</option><option>Sent</option><option>Reimbursed</option></select></div></div><div class="callout">The prototype will not save photos or data. Production requires private AWS S3 and authenticated database sync.</div>'+btn("Preview save (demo only)","demoSave","button primary")+'</section></div>'}
function more(){return '<section class="card"><h2>Company settings & safety</h2>'+row("AWS sync status","Production database not connected","Not live","")+row("Staff permissions","Owner / manager / worker roles","","")+row("Backups & audit","Recoverable history is a release gate","","")+row("Export & GST configuration","Financial policy and company settings","","")+'</section>'}
function draw(){document.querySelector("#sideNav").innerHTML=screens.map(n=>'<button data-go="'+n+'" aria-current="'+(n===current?"page":"false")+'">'+n+'</button>').join("");document.querySelector("#mobileNav").innerHTML=screens.map(n=>'<button data-go="'+n+'" aria-current="'+(n===current?"page":"false")+'">'+n+'</button>').join("");document.querySelector("#title").textContent=current;document.querySelector("#subtitle").textContent=items[current];document.querySelector("#view").innerHTML=current==="Today"?(detail==="bills"?bill():detail==="capture"?capture():today()):current==="Jobs"?jobs():current==="People"?(detail==="weekly"?weekly():people()):current==="Money"?money():more()}
document.addEventListener("click",e=>{const go=e.target.closest("[data-go]"),action=e.target.closest("[data-action]");if(go){current=go.dataset.go;detail="";draw();return}if(!action)return;const a=action.dataset.action;if(a==="checkin"){if(!selected.size){alert("Choose at least one employee.");return}started=true;draw()}else if(a==="checkout"){checkedOut=true;draw()}else if(["capture","viewBills","today"].includes(a)){current="Today";detail=a==="capture"?"capture":a==="viewBills"?"bills":"";draw()}else if(a==="jobs"){current="Jobs";detail="";draw()}else if(["staff","weekly","backPeople"].includes(a)){current="People";detail=a==="staff"?"staff":a==="weekly"?"weekly":"";draw()}else if(a==="payment"){current="Money";detail="";draw()}else if(a==="demoSave"){alert("Prototype only — no data was saved.")}else{alert("Design concept only; this action is not implemented.")}});
document.addEventListener("change",e=>{if(!e.target.matches("[data-crew]"))return;if(e.target.checked)selected.add(e.target.value);else selected.delete(e.target.value);draw()});
draw();
</script></body></html>
