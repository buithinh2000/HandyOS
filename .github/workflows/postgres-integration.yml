name: HandyOS PostgreSQL Integration
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/postgres-integration.yml"
  push:
    paths:
      - "backend/**"
      - ".github/workflows/postgres-integration.yml"
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: handyos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: handyos_ci
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated application role
        run: psql -X -v ON_ERROR_STOP=1 -c "create role handyos_runtime nologin nosuperuser nocreatedb nocreaterole nobypassrls;"
      - name: Apply versioned SQL migrations
        run: |
          psql -X -v ON_ERROR_STOP=1 -f backend/migrations/001_initial.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/migrations/002_rls.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/migrations/003_owner_operations.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/migrations/004_receipt_upload_intents.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/migrations/005_payroll_week_closures.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/migrations/006_staff_expense_adjustments.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/migrations/007_job_financial_settings.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/migrations/008_attendance_corrections.sql
      - name: Verify tenant isolation and job/task insert
        run: psql -X -v ON_ERROR_STOP=1 -f backend/test/postgres-smoke.sql
      - name: Verify owner-only payroll, receipts and tenant RLS
        run: psql -X -v ON_ERROR_STOP=1 -f backend/test/operations-rls-smoke.sql
      - name: Verify weekly payroll settlement RLS and payment allocation
        run: psql -X -v ON_ERROR_STOP=1 -f backend/test/weekly-payroll-rls-smoke.sql
      - name: Verify financial settings, cost RLS and customer pass-through
        run: psql -X -v ON_ERROR_STOP=1 -f backend/test/job-financials-rls-smoke.sql
      - name: Verify immutable attendance correction history and RLS isolation
        run: psql -X -v ON_ERROR_STOP=1 -f backend/test/attendance-corrections-rls-smoke.sql
      - name: Verify employee other expense privacy and week isolation
        run: psql -X -v ON_ERROR_STOP=1 -f backend/test/staff-expense-rls-smoke.sql
      - name: Verify receipt upload isolation and no phantom reimbursement
        run: psql -X -v ON_ERROR_STOP=1 -f backend/test/receipt-intents-rls-smoke.sql
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test-only PostgreSQL adapter dependencies
        run: npm install --prefix backend --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Verify single atomic, RLS-scoped receipt commit in PostgreSQL
        run: node backend/test/receipt-repository.integration.mjs
