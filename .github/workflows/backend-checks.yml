name: HandyOS backend source checks
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check backend/src/domain.mjs
          node --check backend/src/server.mjs
          node --check backend/src/handyos-business-date.mjs
          node --check backend/src/frontend-assets.mjs
          node --check web/boot.mjs
          node --check backend/test/frontend-assets.test.mjs
          node --check backend/src/receipt-workflow.mjs
          node --check backend/src/receipt-runtime.mjs
          node --check backend/src/daily-crew.mjs
          node --check backend/src/weekly-payroll.mjs
          node --check backend/test/weekly-payroll.test.mjs
          node --check backend/test/daily-crew.test.mjs
          node --check backend/test/receipt-runtime.test.mjs
          node --check backend/src/receipt-postgres-repository.mjs
          node --check backend/src/receipt-s3-adapter.mjs
          node --check backend/src/receipt-sdk-factory.mjs
          node --check backend/test/receipt-sdk-factory.test.mjs
          node --check backend/test/receipt-sdk-real-signing.test.mjs
          node --check backend/src/receipt-iphone-upload.mjs
          node --check backend/src/receipt-cloud-controller.mjs
          node --check backend/src/handyos-cloud-api-transport.mjs
          node --check backend/src/handyos-cognito-pkce.mjs
          node --check backend/src/handyos-login-shell.mjs
          node --check backend/src/handyos-workspace-shell.mjs
          node --check backend/src/handyos-today-view.mjs
          node --check backend/src/handyos-jobs-view.mjs
          node --check backend/src/handyos-financials-view.mjs
          node --check backend/src/job-financials.mjs
          node --check backend/test/job-financials.test.mjs
          node --check backend/src/handyos-payroll-view.mjs
          node --check backend/test/handyos-company-bootstrap.test.mjs
          node --check backend/test/handyos-cognito-pkce.test.mjs
          node --check backend/src/handyos-cloud-bills-app.mjs
          node --check backend/test/handyos-cloud-api-transport.test.mjs
          node --check backend/src/receipt-cloud-view.mjs
          node --check backend/test/receipt-cloud-controller.test.mjs
          node --check backend/test/receipt-iphone-upload.test.mjs
          node --check backend/test/receipt-s3-adapter.test.mjs
          node --check backend/src/receipt-http-routes.mjs
          node --check backend/test/receipt-http-routes.test.mjs
          node --check backend/test/receipt-repository.integration.mjs
          node --check backend/test/security.test.mjs
      - name: Check outbound release Python and shell syntax
        run: |
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('deploy/internal/poll-release.py').read_text())"
          bash -n deploy/internal/release-app.sh deploy/internal/auto-release-outbound-setup.sh
          node --test backend/test/internal-auto-release.test.mjs
      - name: Verify Melbourne business date and Today navigation
        run: |
          node --test backend/test/handyos-business-date.test.mjs
          node --input-type=module -e "import fs from 'node:fs';const s=fs.readFileSync('backend/src/handyos-today-view.mjs','utf8');if(!s.includes('data-go-today')||!s.includes('date.value=localDay();void change()'))process.exit(1)"
      - name: Run security domain unit tests (no cloud credentials)
        run: node --test backend/test/job-financials.test.mjs backend/test/weekly-payroll.test.mjs backend/test/daily-crew.test.mjs backend/test/receipt-runtime.test.mjs backend/test/frontend-assets.test.mjs backend/test/handyos-company-bootstrap.test.mjs backend/test/handyos-cognito-pkce.test.mjs backend/test/handyos-cloud-api-transport.test.mjs backend/test/receipt-cloud-controller.test.mjs backend/test/security.test.mjs backend/test/receipt-http-routes.test.mjs backend/test/receipt-s3-adapter.test.mjs backend/test/receipt-sdk-factory.test.mjs backend/test/receipt-iphone-upload.test.mjs
      - name: Install pinned backend SDK packages (no AWS credentials)
        run: npm install --prefix backend --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Verify actual AWS SDK S3 imports without making requests
        run: cd backend && node --input-type=module -e "await import('@aws-sdk/client-s3'); await import('@aws-sdk/s3-request-presigner'); console.log('AWS_SDK_IMPORT_PASS');"
      - name: Test actual SigV4 upload headers with offline fake credentials
        run: cd backend && node --test test/receipt-sdk-real-signing.test.mjs
      - name: Check baseline SQL isolation constraints
        run: |
          grep -q 'create table if not exists memberships' backend/migrations/001_initial.sql
          grep -q 'create table if not exists job_members' backend/migrations/001_initial.sql
          grep -q 'force row level security' backend/migrations/002_rls.sql
          grep -q 'client_visible boolean not null default false' backend/migrations/001_initial.sql
