name: HandyOS one-shot verified dependency lock bootstrap
on:
  push:
    paths:
      - ".github/workflows/lock-bootstrap-once.yml"
permissions:
  contents: write
jobs:
  materialize-reviewed-lock:
    if: github.ref == 'refs/heads/feature/owner-committed-lock'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recreate and verify reviewed lock digest before committing to feature branch
        working-directory: cloud/build
        run: |
          test ! -e package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          printf '%s\n' 'a2f22aba6b58609521c1815c2914905d1f4772dfcaa9a9f92c9bbcc3d267921f  package-lock.json' | sha256sum -c -
      - name: Commit verified lock to isolated PR branch only
        run: |
          git config user.name "HandyOS Lock Verification Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud/build/package-lock.json
          git diff --cached --exit-code && exit 1 || true
          git commit -m "build: commit independently verified full npm dependency lock"
          git push origin HEAD:feature/owner-committed-lock
