name: HandyOS Project Brain continuity gate (source-only)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify continuity documents and financial invariants
        run: node --test tests/continuity-gate.test.mjs tests/owner-ledger.test.mjs
