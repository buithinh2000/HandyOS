name: HandyOS Workspace smoke tests
on:
  push:
    paths:
      - "workspace.html"
      - "tests/**"
      - ".github/workflows/workspace-checks.yml"
  pull_request:
    paths:
      - "workspace.html"
      - "tests/**"
      - ".github/workflows/workspace-checks.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/workspace.test.mjs
