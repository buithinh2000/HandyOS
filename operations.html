<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandyOS Operations</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#193249;font:15px system-ui,Arial}header{padding:18px 5%;background:#123551;color:#fff;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header a{color:#d4eaff}main{max-width:1100px;margin:auto;padding:20px 14px}.card{background:#fff;border:1px solid #dce7ef;padding:18px;border-radius:13px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:#edf4fc;border-radius:10px;padding:13px}.stat strong{display:block;font-size:22px;margin-top:6px}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}button,input,select,textarea{font:inherit;border-radius:8px;border:1px solid #c9d6e4;padding:10px}button{cursor:pointer;background:#e7eef8}button.primary{background:#176acb;color:white;border-color:#176acb}input,select{width:100%;background:white}label{display:block;font-size:12px;color:#63778d;margin-bottom:4px}.muted{color:#68798e}.small{font-size:12px}.warning{background:#fff4dc;padding:12px;border-radius:9px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:570px}th,td{padding:9px;border-bottom:1px solid #e4eaf1;text-align:left}th{font-size:12px;color:#6a7e92}section{display:none}section.active{display:block}.tag{font-size:12px;background:#e8f1fa;border-radius:20px;padding:4px 8px}@media print{header,.tabs,.no-print{display:none!important}.card{border:0}section{display:none!important}section.active{display:block!important}}
</style></head><body><header><b>⚒ HandyOS — Project Operations</b><div><a href="./">Dashboard</a> · <a href="quotes.html">Quote Studio</a></div></header><main><h1>Quản lý công trình</h1><p class="warning small"><b>MVP thử nghiệm:</b> dữ liệu nằm trong trình duyệt này, chưa đồng bộ nhiều người. Không nhập thông tin nhân viên, khách hàng hoặc tài chính nhạy cảm cho đến khi có tài khoản và backend bảo mật.</p>
<div class="card no-print"><div class="grid"><div><label>Công trình đang mở</label><select id="chosen"></select></div><div><label>Tên công trình mới</label><input id="projectName" placeholder="Bathroom renovation"></div><div><label>Mã công trình</label><input id="projectCode" placeholder="JOB-001"></div></div><p><button class="primary" id="addProject">+ Tạo công trình</button> <button id="backup">⬇ Backup</button> <button id="restore">⬆ Restore</button></p></div>
<div id="stats" class="stats"></div><div class="tabs no-print" id="tabs"></div>
<div class="card"><section id="costs"></section><section id="payments"></section><section id="workers"></section><section id="tasks"></section><section id="overview"></section></div></main>
<script>
"use strict";
const KEY="handyos-ops-v03", schema={projects:[],costs:[],payments:[],workers:[],tasks:[]};
let state;try{state={...schema,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{state=structuredClone(schema)}
for(const k of Object.keys(schema))if(!Array.isArray(state[k]))state[k]=[];
let selected=state.projects[0]?.id||"",tab="costs";
const el=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),money=n=>new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD"}).format(Number(n)||0),n=x=>Math.max(0,Number(x)||0),newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),today=()=>new Date().toISOString().slice(0,10),by=k=>state[k].filter(x=>x.project===selected),sum=(arr,fn)=>arr.reduce((a,x)=>a+fn(x),0),sel=()=>state.projects.find(x=>x.id===selected);
function persist(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function input(label,key,type="text"){return '<div><label>'+label+'</label><input id="'+key+'" type="'+type+'"></div>'}
function select(label,key,values){return '<div><label>'+label+'</label><select id="'+key+'">'+values.map(v=>'<option value="'+esc(v[0])+'">'+esc(v[1])+'</option>').join("")+'</select></div>'}
function grid(items){return '<div class="grid">'+items.join("")+'</div>'}
function tabulate(heads,rows){return '<div class="scroll"><table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join("")+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+v+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'}
function getValues(ids){let o={};for(const key of ids)o[key]=el(key).value;return o}
function metrics(){let p=sel(),contract=n(p?.contract),cost=sum(by("costs"),x=>n(x.amount))+sum(by("workers"),x=>n(x.hours)*n(x.rate)),paid=sum(by("payments").filter(x=>x.status==="Received"),x=>n(x.amount));return{contract,cost,paid,due:Math.max(0,contract-paid),difference:contract-cost}}
function render(){
el("chosen").innerHTML=state.projects.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===selected?"selected":"")+'>'+esc(p.name)+'</option>').join("");
const m=metrics();el("stats").innerHTML=[["Hợp đồng gồm GST",m.contract],["Chi phí đã ghi",m.cost],["Đã thu",m.paid],["Còn phải thu",m.due],["Chênh lệch tạm tính",m.difference]].map(a=>'<div class="stat">'+a[0]+'<strong>'+money(a[1])+'</strong></div>').join("");
el("tabs").innerHTML=[["costs","Vật liệu & chi phí"],["payments","Thanh toán"],["workers","Nhân công"],["tasks","Giao việc & lịch"],["overview","Tổng hợp"]].map(a=>'<button data-tab="'+a[0]+'" '+(tab===a[0]?'class="primary"':'')+'>'+a[1]+'</button>').join("");
document.querySelectorAll("section").forEach(x=>x.classList.toggle("active",x.id===tab));
el("costs").innerHTML='<h2>Chi phí thực tế</h2>'+grid([input("Ngày","costDate","date"),select("Nhóm","category",[["Material","Vật liệu"],["Subcontractor","Thầu phụ"],["Transport","Vận chuyển"],["Equipment","Thiết bị"],["Other","Khác"]]),input("Mô tả","description"),input("Nhà cung cấp","supplier"),input("Số tiền AUD","amount","number")])+'<p><button class="primary" data-add="costs">+ Lưu chi phí</button></p>'+tabulate(["Ngày","Nhóm","Mô tả","Supplier","AUD"],by("costs").map(x=>[esc(x.date),esc(x.category),esc(x.description),esc(x.supplier),money(x.amount)]));
el("payments").innerHTML='<h2>Theo dõi thanh toán</h2>'+grid([input("Ngày","payDate","date"),input("Mã đợt / invoice","reference"),input("Số tiền gồm GST","payAmount","number"),select("Trạng thái","payStatus",[["Requested","Đã yêu cầu"],["Received","Đã nhận"],["Overdue","Quá hạn"]])])+'<p><button class="primary" data-add="payments">+ Ghi thanh toán</button></p>'+tabulate(["Ngày","Mã","Số tiền","Trạng thái"],by("payments").map(x=>[esc(x.date),esc(x.reference),money(x.amount),esc(x.status)]))+'<p class="small muted">Chưa gửi email, SMS hoặc nhắc nợ tự động.</p>';
el("workers").innerHTML='<h2>Giờ làm & bảng công dự kiến</h2>'+grid([input("Ngày","workDate","date"),input("Nhân viên (tên thử nghiệm)","worker"),input("Giờ","hours","number"),input("Đơn giá AUD/giờ","rate","number")])+'<p><button class="primary" data-add="workers">+ Ghi giờ</button></p>'+tabulate(["Ngày","Nhân viên","Giờ","Đơn giá","Thành tiền"],by("workers").map(x=>[esc(x.date),esc(x.worker),esc(x.hours),money(x.rate),money(n(x.hours)*n(x.rate))]));
el("tasks").innerHTML='<h2>Lịch & giao việc</h2>'+grid([input("Công việc","task"),input("Giao cho","assignee"),input("Hạn","deadline","date"),select("Trạng thái","taskStatus",[["Todo","Chưa làm"],["Doing","Đang làm"],["Done","Hoàn thành"]])])+'<p><button class="primary" data-add="tasks">+ Thêm việc</button></p>'+tabulate(["Công việc","Người làm","Hạn","Trạng thái"],by("tasks").map(x=>[esc(x.name),esc(x.assignee),esc(x.deadline),'<button data-toggle="'+esc(x.id)+'">'+esc(x.status)+'</button>']));
el("overview").innerHTML='<h2>Tổng hợp hợp đồng</h2><label>Giá trị hợp đồng đã phê duyệt (AUD gồm GST)</label><input type="number" id="contract" value="'+n(sel()?.contract)+'"><p><button class="primary" id="saveContract">Lưu giá trị hợp đồng</button></p>'+tabulate(["Chỉ số","Giá trị"],[["Tổng hợp đồng",money(m.contract)],["Tổng chi phí ghi nhận",money(m.cost)],["Đã thu",money(m.paid)],["Còn phải thu",money(m.due)],["Chênh lệch",money(m.difference)]])+'<p class="small muted">Chênh lệch không phải lợi nhuận ròng: giá trị có thể gồm GST, chưa phản ánh overhead, bảo hiểm, thuế và chi phí chưa ghi. Không sử dụng để quyết toán.</p>';
}
el("chosen").addEventListener("change",e=>{selected=e.target.value;render()});
el("addProject").addEventListener("click",()=>{let name=el("projectName").value.trim();if(!name)return alert("Nhập tên công trình");let p={id:newId(),name,code:el("projectCode").value,contract:0};state.projects.push(p);selected=p.id;persist()});
document.addEventListener("click",e=>{
let btn=e.target.closest("button");if(!btn)return;
if(btn.dataset.tab){tab=btn.dataset.tab;render();return}
if(btn.id==="saveContract"){if(!sel())return alert("Tạo công trình trước");sel().contract=n(el("contract").value);persist();return}
if(btn.dataset.toggle){let x=state.tasks.find(t=>t.id===btn.dataset.toggle);if(x){x.status=x.status==="Done"?"Todo":"Done";persist()}return}
if(!btn.dataset.add)return;
if(!sel())return alert("Tạo công trình trước");
let kind=btn.dataset.add,x={id:newId(),project:selected};
if(kind==="costs"){let o=getValues(["costDate","category","description","supplier","amount"]);Object.assign(x,{date:o.costDate||today(),category:o.category,description:o.description,supplier:o.supplier,amount:n(o.amount)})}
if(kind==="payments"){let o=getValues(["payDate","reference","payAmount","payStatus"]);Object.assign(x,{date:o.payDate||today(),reference:o.reference,amount:n(o.payAmount),status:o.payStatus})}
if(kind==="workers"){let o=getValues(["workDate","worker","hours","rate"]);Object.assign(x,{date:o.workDate||today(),worker:o.worker,hours:n(o.hours),rate:n(o.rate)})}
if(kind==="tasks"){let o=getValues(["task","assignee","deadline","taskStatus"]);Object.assign(x,{name:o.task,assignee:o.assignee,deadline:o.deadline,status:o.taskStatus})}
state[kind].push(x);persist();
});
el("backup").addEventListener("click",()=>{let a=document.createElement("a"),b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});a.href=URL.createObjectURL(b);a.download="HandyOS-operations-"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)});
el("restore").addEventListener("click",()=>{let input=document.createElement("input");input.type="file";input.accept=".json";input.onchange=async()=>{try{let data=JSON.parse(await input.files[0].text());if(!Array.isArray(data.projects)||!Array.isArray(data.costs)||!Array.isArray(data.payments))throw Error();if(confirm("Thay toàn bộ dữ liệu Operations hiện có?")){state={...schema,...data};selected=state.projects[0]?.id||"";persist()}}catch{alert("File backup không hợp lệ")}};input.click()});
render();
</script></body></html>
